# Free staging deployment only. This is not the production environment.
# Free Render Postgres expires after 30 days; use only synthetic test data.
services:
  - type: web
    runtime: node
    name: forest-side-resort-nayek-staging-api
    repo: https://github.com/nayekrishabh1480-netizen/forest-side-resort-platform
    branch: main
    region: singapore
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build:api
    startCommand: npm run prisma:deploy -w @forest-side/api && npm run start -w @forest-side/api
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forest-side-resort-nayek-staging-db
          property: connectionString
      - key: APP_ORIGINS
        value: https://forest-side-resort-nayek-staging.onrender.com
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: WEATHER_LOCATION_NAME
        value: Guptkashi
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "900"

  - type: web
    runtime: static
    name: forest-side-resort-nayek-staging
    repo: https://github.com/nayekrishabh1480-netizen/forest-side-resort-platform
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: https://forest-side-resort-nayek-staging-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: forest-side-resort-nayek-staging-db
    databaseName: forest_side_staging
    plan: free
    region: singapore
